<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    
    <!--listas nao ordenadas-->
        <ul>
            <li>um1</li>
            <li>doix2</li>
            <li>trez3</li>
        </ul>

    <!--lista ordenada e numerada-->
        <ol>  
        <li>cuatro</li>
        <li>sinco</li>
        <li>six</li>
        </ol>

    <!-- <ol type="" ></ol> definir tipo de marcador : A, a, i, I, 1 -->
    <!-- <ol start="2"></ol> definir o numero inicial da lista -->
    <!--reversed></ol> contagem decrescente -->

    <!--lista de descrição (glossario/faq)-->
    <dl>
        <dt>FDS</dt>
        <dd>fim de semana</dd>
        <dt>FECIE</dt>
        <dd>feira de ciencias e ingles do bompa</dd>
    </dl>

    <!--exemplo de menu-->
    <nav aria-label="Menu Principal">
        <ul>
            <li><a href="#inicio"> inicio</a></li>
            <li><a href="#sobre">Sobre</a></li>
        </ul>
    </nav>
    

</body>
</html>
