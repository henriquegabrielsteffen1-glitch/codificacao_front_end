<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<body>
        <table>
            <caption>Nome da tabela</caption>
            <thead>
                <tr>
                    <th scope="col">cabeçalho1</th>
                    <th scope="col">cabeçalho2</th>
                    <th scope="col">cabeçalho3</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>informAçaõ1</td>
                    <td>informAçaõ2</td>
                    <td>informAçaõ3</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3"> roda pé da tabela (n é obeigatorio)</td>
                </tr>
            </tfoot>

        </table>



</body>
</html>

<!-- 
tbody = corpo da tabela
thead = cabeçalho da tabela
tr = linhas da tabela
tfoot = roda pé


-->
