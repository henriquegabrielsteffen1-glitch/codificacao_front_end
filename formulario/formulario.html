<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <form action="index67.html" method="post">

        <label for="nomeCompleto">Nome Completo</label>
        <input type="text" id="nomeCompleto" name="nomeCompleto">


        <label>
              E-mail
             <input type="email" name="EmailDoUsuario">
        </label>

        <label for="dataDeNascimento">Data de nascimento</label>
        <input type="date" id="dataDeNascimento" name="dataDeNascimento">

        <label for="idade">idade</label>
        <input type="number" id="idade" name="idade">

        <label for="Senha">Senha</label>
        <input type="password" id="Senha" name="Senha">

        <label for="curriculo">curriculo</label>
        <input type="file" id="curriculo" name="curriculo"
            accept=".pdf">

        <label for="telefone">telefone</label>
        <input type="tel" id="telefone" name="telefone">

        <label for="url">url</label>
        <input type="url" id="url" name="url">

        <label for="time">time</label>
        <input type="time" id="time" name="time">

        <label for="datetime-local">datatime-local</label>
        <input type="datetime-local" id="datatime-local" name="datatime-local">

        <label for="month">month</label>
        <input type="month" id="month" name="month">

        <label for="week">week</label>
        <input type="week" id="week" name="week">

        <label for="color">color</label>
        <input type="color" id="color" name="color">

        <label for="range">range</label>
        <input type="range" min="0" max="10" step="1" id="range" name="range">

        <label for="search">search</label>
        <input type="search" id="search" name="search">

        <!--Checkbox-->
        <p>escolha um numero</p>
            <label><input type="checkbox" name="numeros" value="6"><HTML>six</label> <br>
            <label><input type="checkbox" name="numeros" value="7"><HTML>seven</label><br>
            <label><input type="checkbox" name="numeros" value="8"><HTML>four</label><br>
            <label><input type="checkbox" name="numeros" value="2"><HTML>two</label><br>
            <label><input type="checkbox" name="numeros" value="66"><HTML>seis</label><br>
            <label><input type="checkbox" name="numeros" value="7"><HTML>sete</label><br>

            <p>quantas noite eu tenho no 99 noittes</p>
                <label><input type="radio" name="numeros" value="0"><HTML>0</label><br>
                <label><input type="radio" name="numeros" value="2026"><HTML>2026</label><br>
                <label><input type="radio" name="numeros" value="106"><HTML>106</label><br>
                <label><input type="radio" name="numeros" value="415"><HTML>415</label><br>

            




        <button type="submit">Enviar</button>

    </form>

    <label for="seilaoq">seilaoq</label>
        <select id="seilaoq" name="seilaoq">
            <option value="">selecione.............</option>
            <option value="sei">sei</option>
            <option value="seia">sla</option>
            <option value="seis">la</option>
            <optgroup label="nomsei">
                <option value="n">nom</option>
                <option value="na">nomsei</option>
                <option value="ns">nsei</option>
                <option value="nsd">nomsem</option>

            </optgroup>
        </select>

        <label for="cidade"></label>
        <input list="cidades" id="cidade" name="cidade">
        <datalist id="cidades">
            <option value="cco">
            <option value="xaxim">
            <option value="joao pessoa">

        </datalist>

</body>
</html>
